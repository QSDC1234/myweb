<!doctype html>
<html>
<head><meta charset="utf-8"><title>WebGL test</title>
<style>body{margin:0;background:#111;color:#fff;font-family:sans-serif}</style>
</head>
<body>
<div id="msg" style="position:absolute;top:0;left:0;padding:8px;font-size:20px;z-index:2">checking...</div>
<canvas id="c" width="800" height="600"></canvas>
<script>
const msg = document.getElementById('msg');
const c = document.getElementById('c');
const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
if (!gl) { msg.textContent = 'WEBGL_FAIL'; msg.style.color='red'; }
else {
  msg.textContent = 'WEBGL_OK';
  msg.style.color = '#0f0';
  gl.clearColor(0.05,0.08,0.12,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  // draw a triangle via minimal pipeline
  const vs = 'attribute vec2 p; void main(){ gl_Position = vec4(p,0,1); }';
  const fs = 'precision mediump float; void main(){ gl_FragColor = vec4(0.9,0.6,0.1,1.0); }';
  function sh(t,src){ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0.8,-0.8,-0.7,0.8,-0.7]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
</script>
</body>
</html>
